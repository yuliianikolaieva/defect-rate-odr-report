name: Weekly ODR refresh

on:
  schedule:
    # Monday 09:00 Kyiv (EEST, UTC+3). After DST ends (EET, UTC+2) this becomes 08:00 Kyiv.
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync with main
        run: git pull --rebase origin main

      - name: Fetch Databricks data
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
          DATABRICKS_WAREHOUSE_ID: ${{ secrets.DATABRICKS_WAREHOUSE_ID }}
        run: python3 generate_report.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.js
          if git diff --cached --quiet; then
            echo "No data.js changes to publish."
            exit 0
          fi
          git commit -m "Weekly ODR update: $(date -u +'%Y-%m-%d')"
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push origin main && exit 0
            echo "Push attempt ${attempt} failed; retrying..."
            sleep 10
          done
          exit 1
